  if (!ev.length) { $('rep').textContent = 'Aún no hay vídeos'; setTimeout(() => ($('rep').textContent = '▶ Repetición'), 2200); return; }
  S.replay = true; $('rep').classList.add('on'); $('rep').textContent = '● Repitiendo'; cerrar(); controls.autoRotate = false; $('giro').classList.remove('on');
  let prev = null; const paso = Math.max(900, Math.min(2400, 30000 / ev.length));
  for (const a of ev) {
    const e = eqDe(a.agente), s = salas[e.id];
    EQ.forEach((x) => (salas[x.id].activo = 0)); s.activo = paso / 1000 + .4; s.msg = a;
    if (prev && prev !== e.id) pasarTrabajo(prev, e.id);
    prev = e.id; volarA(e); actualizar();
    await new Promise((r) => setTimeout(r, paso));
  }
  S.replay = false; EQ.forEach((x) => (salas[x.id].activo = 0)); $('rep').classList.remove('on'); $('rep').textContent = '▶ Repetición';
  aCasa(); actualizar();
};

// ---------- datos en directo ----------
function refrescar() { actualizar(); cinta(); if (S.abierta) pintarFicha(); if (S.vista !== 'oficina') pintarVista(); }
async function cargar() {
  const desde = new Date(Date.now() - 7 * 864e5).toISOString();
  const [a, p, l, t] = await Promise.all([
    sb.from('actividad').select('*').gte('at', desde).order('at', { ascending: false }).limit(1500),
    sb.from('panel').select('data').eq('id', 1).maybeSingle(),
    sb.from('aprendizajes').select('id', { count: 'exact', head: true }).eq('activo', true),
    sb.from('tendencias').select('video_id', { count: 'exact', head: true }).eq('analizado', false),
  ]);
  if (p.error || !p.data) { $('login').hidden = false; return false; }
  S.act = a.data || []; S.panel = p.data.data; S.lecs = l.count || 0; S.pend = t.count || 0;
  refrescar(); return true;
}
(async () => {
  const { data } = await sb.auth.getSession();
  if (!data.session) { $('login').hidden = false; return; }
  if (!(await cargar())) return;
  sb.channel('oficina')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'actividad' }, (x) => {
      const prev = S.act.find((q) => eqDe(q.agente) && eqDe(q.agente).id !== 'explorador'); S.act.unshift(x.new);
      const a = eqDe(x.new.agente);
      if (a) { salas[a.id].activo = 6; if (prev && a.id !== 'explorador') pasarTrabajo(eqDe(prev.agente).id, a.id); }
      refrescar();
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'panel' }, (x) => { if (x.new && x.new.data) { S.panel = x.new.data; actualizar(); } })
    .subscribe();
  setInterval(cargar, 120000); setInterval(actualizar, 30000);
})();
window.__oficina = { S, abrir, salas };
</script>
