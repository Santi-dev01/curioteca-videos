  const paso = (t) => { const k = Math.min(1, (t - t0) / ms), e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    svg.setAttribute('viewBox', from.map((f, i) => f + (to[i] - f) * e).join(' ')); if (k < 1) requestAnimationFrame(paso); };
  requestAnimationFrame(paso);
}

// ---------- datos ----------
function trabajando(e) {
  const ult = S.act.find((a) => equipoDe(a.agente) === e);
  if (!ult) return false;
  const reciente = Date.now() - new Date(ult.at) < (e.id === 'explorador' ? 15 : 10) * 60e3;
  if (e.id === 'explorador') return reciente;
  const cur = S.panel && S.panel.current, ultimoGlobal = S.act.find((a) => equipoDe(a.agente) && equipoDe(a.agente).id !== 'explorador');
  return !!cur && reciente && ultimoGlobal && equipoDe(ultimoGlobal.agente) === e;
}
const hoy = () => S.act.filter((a) => new Date(a.at) >= hoyIni());
function usosHoy(e) { return hoy().filter((a) => equipoDe(a.agente) === e).length; }
function chispa(e) { // usos por hora (últimas 12 h)
  const n = Array(12).fill(0), ahora = Date.now();
  S.act.forEach((a) => { if (equipoDe(a.agente) !== e) return; const hh = Math.floor((ahora - new Date(a.at)) / 3600e3); if (hh < 12) n[11 - hh]++; });
  const m = Math.max(1, ...n), w = 80, hh = 20;
  return `<svg width="${w}" height="${hh}" viewBox="0 0 ${w} ${hh}"><polyline fill="none" stroke="${e.color}" stroke-width="1.6" points="${n.map((v, i) => `${(i / 11 * w).toFixed(1)},${(hh - 2 - v / m * (hh - 4)).toFixed(1)}`).join(' ')}"/></svg>`;
}

// ---------- ficha de una sala ----------
function abrir(id) {
  const e = EQ.find((x) => x.id === id); if (!e) return;
  S.abierta = id;
  const x0 = e.pos[0] * PASO, y0 = e.pos[1] * PASO;
  const a = P(x0 - 1, y0 - 1, 5), b = P(x0 + CEL + 1, y0 + CEL + 1), l = P(x0 - 1, y0 + CEL + 1), r = P(x0 + CEL + 1, y0 - 1);
  const minx = Math.min(a[0], l[0]) - 10, maxx = Math.max(b[0], r[0]) + 10, miny = a[1] - 30, maxy = b[1] + 10;
  // misma proporción que el plano entero y la sala en la mitad de arriba (abajo va la ficha)
  const asp = vb0[3] / vb0[2];
  let w = maxx - minx, hh = w * asp;
  if (maxy - miny > hh * 0.5) { hh = (maxy - miny) / 0.5; w = hh / asp; }
  const mx = (minx + maxx) / 2;
  zoom([mx - w / 2, miny - hh * 0.04, w, hh]);
  ficha();
  $('hoja').classList.add('on');
}
function ficha() {
  const e = EQ.find((x) => x.id === S.abierta); if (!e) return;
  const act = trabajando(e), mis = S.act.filter((a) => equipoDe(a.agente) === e), ult = mis[0];
  const c = $('hojac'); c.replaceChildren();
  c.append(h('div', 'eq', `Equipo ${e.nombre} · ${e.miembros.filter((m) => !['Director', 'Revisor de imágenes'].includes(m)).length} agente(s)`));
  const t = h('div', 'tit'); const av = h('div', 'av', e.ic); av.style.background = e.color + '33'; t.append(av, h('h2', null, e.nombre)); c.append(t);
  c.append(h('div', 'estado' + (act ? ' on' : ''), act ? `Trabajando · ${ult ? ult.texto.slice(0, 90) : ''}` : `Libre · ${e.desc}`));
  c.append(h('div', 'sec', 'Hoy'));
  const kp = h('div', 'kp');
  const k1 = h('div'); k1.append(h('small', null, 'Usos hoy'), h('b', null, String(usosHoy(e)))); const sp = h('i'); sp.innerHTML = chispa(e); k1.append(sp);
  const k2 = h('div'); k2.append(h('small', null, 'Trabajando'), h('b', null, act ? '1' : '0'), h('i', null, act ? 'ahora mismo' : 'en espera'));
  const k3 = h('div'); k3.append(h('small', null, e.id === 'explorador' ? 'Por ver' : 'Encargos'), h('b', null, String(e.id === 'explorador' ? S.pend : (S.panel && S.panel.current ? 1 : 0))), h('i', null, e.id === 'explorador' ? 'Shorts en cola' : 'pendientes'));
  kp.append(k1, k2, k3); c.append(kp);
  const s2 = h('div', 'sec'); s2.append(document.createTextNode('Conexiones'), h('em', null, `${e.con.length} activas`)); c.append(s2);
  const ch = h('div', 'chips'); e.con.forEach((n) => { const s = h('span', null, n); s.append(h('small', null, 'conectada')); ch.append(s); }); c.append(ch);
  const s3 = h('div', 'sec'); s3.append(document.createTextNode('Habilidades'), h('em', null, act ? '1 en uso' : '')); c.append(s3);
  const sem = S.act.filter((a) => equipoDe(a.agente) === e && Date.now() - new Date(a.at) < 7 * 864e5).length;
  e.hab.forEach((nombre, i) => {
    const row = h('div', 'hab'); const bar = h('div', 'b'), bi = h('i'); bi.style.width = Math.max(8, Math.min(100, (sem / (i + 1)) * 6)) + '%'; bi.style.background = e.color; bar.append(bi);
    row.append(h('span', null, nombre), bar, h('small', null, act && i === 0 ? 'en uso' : `${Math.round(sem / (i + 1))} sem`)); c.append(row);
  });
  c.append(h('div', 'sec', 'Lo último que ha hecho'));
  const ul = h('ul', 'feed');
  if (!mis.length) ul.append(h('li', 'vacio', 'Todavía nada. Aparecerá aquí en cuanto trabaje.'));
  mis.slice(0, 8).forEach((a) => { const li = h('li'); const dot = h('i'); dot.style.background = e.color; const p = h('p', null, a.texto); li.append(dot, p, h('time', null, hora(a.at))); ul.append(li); });
  c.append(ul);
}
function cerrar() { $('hoja').classList.remove('on'); S.abierta = null; if (vb0) zoom(vb0); }

// ---------- otras vistas ----------
function vistaTareas() {
  const v = $('v-tareas'); v.replaceChildren();
  const steps = (S.panel && S.panel.current && S.panel.current.steps) || [];
  const cuenta = (st) => steps.filter((s) => s.state === st).length;
  v.append(h('div', 'sec', 'Tablero · hoy'));
  const tb = h('div', 'tablero');
  [['Por hacer', cuenta('pendiente')], ['En curso', cuenta('en_curso')], ['Encargos', S.pend], ['Hecho', hoy().length]].forEach(([n, x], i) => { const d = h('div', i === 1 && x ? 'on' : ''); d.append(h('b', null, String(x)), h('small', null, n)); tb.append(d); });
  v.append(tb);
  v.append(h('div', 'sec', S.panel && S.panel.current ? 'Vídeo en marcha' : 'Lo último de cada equipo'));
  const ul = h('ul', 'feed');
  EQ.forEach((e) => { const u = S.act.find((a) => equipoDe(a.agente) === e); const li = h('li'); const dot = h('i'); dot.style.background = e.color;
    const p = h('p'); p.append(h('b', null, e.nombre + ' '), document.createTextNode(u ? u.texto.slice(0, 120) : 'sin trabajo todavía')); li.append(dot, p, h('time', null, u ? hora(u.at) : '')); ul.append(li); });
  v.append(ul);
}
function vistaActividad() {
  const v = $('v-actividad'); v.replaceChildren(); v.append(h('div', 'sec', 'Actividad en directo'));
  const ul = h('ul', 'feed');
  if (!S.act.length) ul.append(h('li', 'vacio', 'Aún no hay actividad.'));
  S.act.slice(0, 80).forEach((a) => { const e = equipoDe(a.agente); const li = h('li'); const dot = h('i'); dot.style.background = e ? e.color : '#888';
    const p = h('p'); p.append(h('b', null, a.agente + ' '), document.createTextNode(a.texto)); li.append(dot, p, h('time', null, hora(a.at))); ul.append(li); });
  v.append(ul);
}
async function vistaCerebro() {
  const v = $('v-cerebro'); v.replaceChildren();
  v.append(h('div', 'sec', 'El cerebro'));
  const kp = h('div', 'kp');
  [['Notas', S.lecs, 'lecciones activas'], ['Alimentado hoy', hoy().length, 'cosas nuevas'], ['Equipos', EQ.length, '+ cerebro']].forEach(([a, b, c]) => { const d = h('div'); d.append(h('small', null, a), h('b', null, String(b)), h('i', null, c)); kp.append(d); });
  v.append(kp);
  v.append(h('p', 'vacio', 'La memoria de todos los equipos: lo que cada uno hace queda escrito aquí, y lo que aprende el Explorador lo usan los demás.'));
  const { data } = await sb.from('aprendizajes').select('para, texto').eq('activo', true).order('creado_at', { ascending: false }).limit(15);
  v.append(h('div', 'sec', 'Lo que saben ahora'));
  const ul0 = h('ul', 'feed');
  if (!(data || []).length) ul0.append(h('li', 'vacio', 'Todavía nada: el Explorador empezará a aprender en cuanto tenga sus claves.'));
  (data || []).forEach((l) => { const li = h('li'); const dot = h('i'); dot.style.background = '#60a5fa'; const p = h('p'); p.append(h('b', null, l.para + ' '), document.createTextNode(l.texto)); li.append(dot, p, h('time')); ul0.append(li); });
  v.append(ul0);
  v.append(h('div', 'sec', 'Lo que entró hoy'));
  const ul = h('ul', 'feed');
  hoy().slice(0, 30).forEach((a) => { const e = equipoDe(a.agente); const li = h('li'); const dot = h('i'); dot.style.background = e ? e.color : '#888';
    const p = h('p'); p.append(h('b', null, (e ? e.nombre : a.agente) + ' '), document.createTextNode(a.texto.slice(0, 140))); li.append(dot, p, h('time', null, hora(a.at))); ul.append(li); });
  if (!hoy().length) ul.append(h('li', 'vacio', 'Nada todavía hoy.'));
  v.append(ul);
}
function cambiarVista(vv) {
  S.vista = vv;
  document.querySelectorAll('#tabs button').forEach((b) => b.classList.toggle('on', b.dataset.v === vv));
  ['oficina', 'tareas', 'actividad', 'cerebro'].forEach((n) => ($('v-' + n).hidden = n !== vv));
  if (vv !== 'oficina') $('hoja').classList.remove('on');
  pintar();
}
function pintar() {
  const n = EQ.filter(trabajando).length;
  $('ntrab').textContent = `${n} trabajando`; $('ntar').textContent = String(hoy().length);
  if (S.vista === 'oficina') {
    const vb = svg && svg.getAttribute('viewBox'); dibujar(); if (S.abierta && vb) { svg.setAttribute('viewBox', vb); ficha(); }
    const ul = $('ahora'); ul.replaceChildren();
    if (!S.act.length) ul.append(h('li', 'vacio', 'Aún no hay actividad.'));
    S.act.slice(0, 12).forEach((a) => { const e = equipoDe(a.agente); const li = h('li'); const dot = h('i'); dot.style.background = e ? e.color : '#888';
      const p = h('p'); p.append(h('b', null, (e ? e.nombre : a.agente) + ' '), document.createTextNode(a.texto.slice(0, 140))); li.append(dot, p, h('time', null, hora(a.at))); ul.append(li); });
  }
  if (S.vista === 'tareas') vistaTareas();
  if (S.vista === 'actividad') vistaActividad();
  if (S.vista === 'cerebro') vistaCerebro();
}

// ---------- carga y directo ----------
async function cargar() {
  const desde = new Date(Date.now() - 7 * 864e5).toISOString();
  const [a, p, l, t] = await Promise.all([
    sb.from('actividad').select('*').gte('at', desde).order('at', { ascending: false }).limit(1500),
    sb.from('panel').select('data').eq('id', 1).maybeSingle(),
    sb.from('aprendizajes').select('id', { count: 'exact', head: true }).eq('activo', true),
    sb.from('tendencias').select('video_id', { count: 'exact', head: true }).eq('analizado', false),
  ]);
  if (p.error || !p.data) { $('login').hidden = false; $('v-oficina').hidden = true; return false; }
  S.act = a.data || []; S.panel = p.data.data; S.lecs = l.count || 0; S.pend = t.count || 0;
  pintar(); return true;
}
$('tabs').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) cambiarVista(b.dataset.v); });
$('cerrar').addEventListener('click', cerrar);
(async () => {
  const { data } = await sb.auth.getSession();
  if (!data.session) { $('login').hidden = false; $('v-oficina').hidden = true; return; }
  if (!(await cargar())) return;
  sb.channel('oficina')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'actividad' }, (x) => { S.act.unshift(x.new); pintar(); })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'panel' }, (x) => { if (x.new && x.new.data) { S.panel = x.new.data; pintar(); } })
    .subscribe();
  setInterval(cargar, 120000);
  setInterval(() => { if (S.vista === 'oficina') pintar(); }, 60000);
})();
</script>
